<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>페어플레이 관찰 기록 — 교사용 조회</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; min-height: 100vh; }
  .header {
    background: linear-gradient(135deg, #1a1a2e, #0f3460);
    color: white; padding: 20px 16px; text-align: center;
  }
  .header h1 { font-size: 18px; margin-bottom: 4px; }
  .header p { font-size: 12px; opacity: 0.7; }
  .container { max-width: 720px; margin: 0 auto; padding: 16px; }
  .card {
    background: white; border-radius: 14px; padding: 16px;
    margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.07);
  }
  .card h2 { font-size: 14px; font-weight: 700; color: #0f3460; margin-bottom: 12px; }
  input {
    width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1;
    border-radius: 10px; font-size: 13px; font-family: inherit;
  }
  input.code-input { border-color: #f59e0b; background: #fffbeb; font-weight: 600; }
  .btn {
    padding: 10px 18px; border: none; border-radius: 10px;
    font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .btn-primary { background: #0f3460; color: white; }
  .btn-primary:disabled { background: #94a3b8; cursor: wait; }
  .btn-outline { background: white; color: #0f3460; border: 1px solid #0f3460; }
  .btn-danger  { background: white; color: #dc2626; border: 1px solid #fca5a5; font-size: 11px; padding: 6px 10px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row input { flex: 1; }
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 20px;
    font-size: 11px; font-weight: 700;
  }
  .badge-blue { background: #eff6ff; color: #1d4ed8; }
  .badge-red  { background: #fef2f2; color: #b91c1c; }
  .badge-gray { background: #f1f5f9; color: #64748b; }
  .summary-bar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px;
  }
  .record-card {
    border: 1px solid #e2e8f0; border-radius: 12px;
    margin-bottom: 10px; overflow: hidden;
  }
  .record-summary {
    display: flex; align-items: center; gap: 10px;
    padding: 12px; background: #f8fafc; cursor: pointer;
    border: none; width: 100%; text-align: left;
  }
  .record-summary:hover { background: #f1f5f9; }
  .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: #0f3460; color: white;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 800; flex-shrink: 0;
  }
  .record-detail { padding: 12px; border-top: 1px solid #e2e8f0; display: none; }
  .record-detail.open { display: block; }
  table { width: 100%; border-collapse: collapse; font-size: 11px; }
  th { background: #0f3460; color: white; padding: 6px; font-weight: 600; }
  td { padding: 6px; border-bottom: 1px solid #f1f5f9; }
  tr:nth-child(even) td { background: #f8fafc; }
  .memo-box {
    margin-top: 10px; padding: 10px 12px;
    background: #fffbeb; border: 1px solid #fcd34d;
    border-radius: 8px; font-size: 12px; color: #92400e; line-height: 1.6;
  }
  .totals {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px;
  }
  .total-box {
    border-radius: 10px; padding: 10px; text-align: center;
    font-weight: 800;
  }
  .total-box.blue { background: linear-gradient(135deg,#1d4ed8,#3b82f6); color: white; }
  .total-box.red  { background: linear-gradient(135deg,#b91c1c,#ef4444); color: white; }
  .total-box .num { font-size: 24px; }
  .total-box .lbl { font-size: 11px; opacity: .85; }
  .empty { text-align: center; padding: 32px 0; }
  .empty .icon { font-size: 40px; margin-bottom: 8px; }
  .empty p { font-size: 13px; color: #64748b; }
  .info-box {
    background: #fff7ed; border: 1px solid #fed7aa;
    border-radius: 8px; padding: 10px 12px;
    font-size: 11px; color: #92400e; line-height: 1.6; margin-top: 10px;
  }
  .error-box {
    background: #fef2f2; border: 1px solid #fca5a5;
    border-radius: 8px; padding: 10px 12px; font-size: 12px; color: #991b1b;
  }
</style>
</head>
<body>

<div class="header">
  <h1>👩‍🏫 페어플레이 관찰 기록 조회</h1>
  <p>2026 FIFA 북중미 월드컵 체육 학습자료</p>
</div>

<div class="container">

  <div class="card">
    <h2>🔑 수업 코드 입력</h2>
    <div class="row">
      <input id="codeInput" class="code-input" placeholder="예: 김체육-2반, 화접중-3-1" />
      <button class="btn btn-primary" id="queryBtn" onclick="loadRecords()">조회</button>
    </div>
    <div class="info-box" style="margin-top:10px">
      💡 학생용 앱에서 학생들이 제출할 때 사용한 수업 코드와 <strong>정확히 같은 코드</strong>를 입력하세요.
    </div>
  </div>

  <div id="resultArea"></div>

</div>

<footer style="text-align:center;padding:20px 16px;font-size:11px;color:#94a3b8;line-height:1.7">
  체육 학습자료 · 2026 FIFA 북중미 월드컵 · 페어플레이 관찰 기록<br>
  <span style="opacity:.8">v1.0.0 · &copy; 2026 화접중학교 · 제작 <a href="https://github.com/Kimjs99" style="color:inherit">Kimjs99</a>. All rights reserved.</span>
</footer>

<script>
  // Apps Script 웹앱 주소 (학생용 APPS_SCRIPT_URL 과 동일). 어디서 열리든(Apps Script·GitHub Pages·로컬 파일) 항상 이 주소로 조회.
  var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwK_zMW331IT9VeuDhfZnKC_qzO8H2Gnw6CkP8cP4NosPvDrdJyxR79qMyRJcwUTiEBSQ/exec";
  var SCRIPT_URL = APPS_SCRIPT_URL;

  var fairplayLabels = [
    "악수·인사", "부상 시 경기중단", "상대 일으켜 세우기",
    "판정 승복", "절제된 세리머니", "패자 위로",
    "정직한 양보", "최선을 다하는 모습", "의무팀 배려", "국기·국가 존중"
  ];

  function normCode(s) {
    return (s || "").trim()
      .replace(/[\s/\\'"]+/g, "-")
      .replace(/-+/g, "-")
      .replace(/^-|-$/, "")
      .toLowerCase();
  }

  function loadRecords() {
    var rawCode = document.getElementById("codeInput").value;
    var code = normCode(rawCode);
    if (!code) { alert("수업 코드를 입력해 주세요."); return; }

    var btn = document.getElementById("queryBtn");
    btn.disabled = true;
    btn.textContent = "조회 중...";
    document.getElementById("resultArea").innerHTML =
      '<div class="card"><div class="empty"><div class="icon">⏳</div><p>불러오는 중...</p></div></div>';

    var url = SCRIPT_URL + "?action=query&code=" + encodeURIComponent(code);
    fetch(url)
      .then(function(r){ return r.json(); })
      .then(function(data){
        btn.disabled = false;
        btn.textContent = "조회";
        if (!data.ok) {
          document.getElementById("resultArea").innerHTML =
            '<div class="card"><div class="error-box">❌ ' + (data.error||"오류") + '</div></div>';
          return;
        }
        renderRecords(code, data.records || []);
      })
      .catch(function(err){
        btn.disabled = false;
        btn.textContent = "조회";
        document.getElementById("resultArea").innerHTML =
          '<div class="card"><div class="error-box">❌ 네트워크 오류가 발생했어요. 잠시 후 다시 시도해 주세요.</div></div>';
      });
  }

  function renderRecords(code, records) {
    var area = document.getElementById("resultArea");
    if (records.length === 0) {
      area.innerHTML = '<div class="card"><div class="empty"><div class="icon">📭</div>' +
        '<p><strong>' + code + '</strong> 코드로 제출된 기록이 없어요.<br>학생들이 같은 코드로 제출하면 여기에 표시됩니다.</p></div></div>';
      return;
    }

    var html = '<div class="card">'
      + '<h2>📋 제출 기록</h2>'
      + '<div class="summary-bar">'
      + '<div><span class="badge badge-gray">📋 ' + code + '</span> &nbsp; 총 <strong>' + records.length + '</strong>건</div>'
      + '<button class="btn btn-outline" onclick="loadRecords()">🔄 새로고침</button>'
      + '</div>';

    records.forEach(function(r, i) {
      var nameInitial = (r["이름"] || "?").toString().slice(0,2);
      var tA = Number(r["합계(A)"] || 0);
      var tB = Number(r["합계(B)"] || 0);
      var rowNum = r["_row"];

      html += '<div class="record-card">'
        + '<button class="record-summary" onclick="toggleDetail(\'rec'+i+'\')">'
        + '<div class="avatar">' + nameInitial + '</div>'
        + '<div style="flex:1;min-width:0">'
        + '<div style="font-size:13px;font-weight:700;color:#1e293b">'
        + (r["학반"] ? r["학반"] + " " : "") + r["이름"]
        + '</div>'
        + '<div style="font-size:11px;color:#64748b;margin-top:2px">'
        + '📺 ' + (r["팀A"]||"팀A") + ' vs ' + (r["팀B"]||"팀B")
        + ' &nbsp;·&nbsp; 총 ' + (tA+tB) + '회 관찰'
        + '</div>'
        + '</div>'
        + '<span class="badge badge-blue">' + tA + '</span>'
        + '<span class="badge badge-red">' + tB + '</span>'
        + '<span style="font-size:12px;color:#94a3b8">▼</span>'
        + '</button>'
        + '<div class="record-detail" id="rec'+i+'">'
        + '<div style="font-size:11px;color:#94a3b8;margin-bottom:8px">제출: ' + (r["제출시각"]||"-") + '</div>'
        + '<table>'
        + '<thead><tr><th>관찰 항목</th><th>🔵 ' + (r["팀A"]||"팀A") + '</th><th>🔴 ' + (r["팀B"]||"팀B") + '</th></tr></thead>'
        + '<tbody>';

      var colsA = ["악수·인사(A)","부상중단(A)","상대일으킴(A)","판정승복(A)","절제세리머니(A)","패자위로(A)","정직양보(A)","최선(A)","의무팀배려(A)","국가존중(A)"];
      var colsB = ["악수·인사(B)","부상중단(B)","상대일으킴(B)","판정승복(B)","절제세리머니(B)","패자위로(B)","정직양보(B)","최선(B)","의무팀배려(B)","국가존중(B)"];

      for (var j = 0; j < fairplayLabels.length; j++) {
        var a = Number(r[colsA[j]] || 0);
        var b = Number(r[colsB[j]] || 0);
        if (a + b === 0) continue;
        html += '<tr>'
          + '<td>' + fairplayLabels[j] + '</td>'
          + '<td style="text-align:center;font-weight:700;color:' + (a>0?"#1d4ed8":"#cbd5e1") + '">' + a + '</td>'
          + '<td style="text-align:center;font-weight:700;color:' + (b>0?"#b91c1c":"#cbd5e1") + '">' + b + '</td>'
          + '</tr>';
      }
      html += '<tr style="background:#eff6ff;font-weight:800"><td>합계</td>'
        + '<td style="text-align:center;color:#1d4ed8">' + tA + '</td>'
        + '<td style="text-align:center;color:#b91c1c">' + tB + '</td>'
        + '</tr></tbody></table>';

      html += '<div class="totals">'
        + '<div class="total-box blue"><div class="lbl">🔵 ' + (r["팀A"]||"팀A") + '</div><div class="num">' + tA + '</div></div>'
        + '<div class="total-box red"><div class="lbl">🔴 ' + (r["팀B"]||"팀B") + '</div><div class="num">' + tB + '</div></div>'
        + '</div>';

      if (r["메모"]) {
        html += '<div class="memo-box">💬 <strong>학생 메모:</strong> ' + escHtml(String(r["메모"])) + '</div>';
      }

      html += '<div style="margin-top:10px">'
        + '<button class="btn btn-danger" onclick="deleteRecord(\'' + escHtml(code) + '\',' + rowNum + ',this)">🗑️ 이 기록 삭제</button>'
        + '</div>';

      html += '</div></div>'; // record-detail + record-card
    });

    html += '</div>'; // card
    area.innerHTML = html;
  }

  function toggleDetail(id) {
    var el = document.getElementById(id);
    el.classList.toggle("open");
  }

  function deleteRecord(code, rowNum, btn) {
    if (!confirm("이 제출 기록을 삭제할까요?")) return;
    btn.disabled = true;
    btn.textContent = "삭제 중...";
    var url = SCRIPT_URL + "?action=delete&code=" + encodeURIComponent(code) + "&row=" + rowNum;
    fetch(url)
      .then(function(r){ return r.json(); })
      .then(function(data){
        if (data.ok) {
          loadRecords();
        } else {
          alert("삭제 실패: " + (data.error||"오류"));
          btn.disabled = false;
          btn.textContent = "🗑️ 이 기록 삭제";
        }
      })
      .catch(function(){
        alert("네트워크 오류. 다시 시도해 주세요.");
        btn.disabled = false;
        btn.textContent = "🗑️ 이 기록 삭제";
      });
  }

  function escHtml(s) {
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  // 엔터키로도 조회
  document.getElementById("codeInput").addEventListener("keydown", function(e){
    if (e.key === "Enter") loadRecords();
  });
</script>
</body>
</html>
